  <title>SIMULATIONS | INEBRIANT STUDIOS</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg: #000;
      --fg: #ffffff;
      --sub: #9a9a9a;
      --border: rgba(255,255,255,0.14);
      --border-hover: rgba(255,255,255,0.35);
    }

    body {
      margin: 0;
      padding: 2.5rem 1rem 5rem;
      background: var(--bg);
      color: var(--fg);
      text-align: center;
      font-family: Arial, sans-serif;
      animation: fadeIn 700ms ease-out both;
    }

    /* CONTACT */
    .contact {
      margin-bottom: 2rem;
      font-size: 0.8rem;
      letter-spacing: 0.6px;
    }

    .contact a {
      color: var(--sub);
      text-decoration: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
    }

    .contact a:hover { color: var(--fg); }

    /* TITLES */
    .studio-title {
      margin: 0 0 0.75rem;
      font-size: 2.6rem;
      letter-spacing: 0.35rem;
      text-transform: uppercase;
      font-weight: 400;
      font-family: "Times New Roman", Times, Georgia, serif;
    }

    .page-title {
      margin: 0 0 3.25rem;
      font-size: 0.95rem;
      letter-spacing: 0.22rem;
      text-transform: uppercase;
      color: var(--sub);
    }

    /* ── SIMULATION LIST ── */
    .sim-list {
      max-width: 520px;
      margin: 0 auto 3.5rem;
      border-top: 1px solid var(--border);
    }

    .sim-list a {
      display: block;
      padding: 1.6rem 0.5rem;
      border-bottom: 1px solid var(--border);
      color: var(--sub);
      text-decoration: none;
      font-family: "Times New Roman", Times, Georgia, serif;
      font-size: 1.5rem;
      letter-spacing: 0.3rem;
      text-transform: uppercase;
      transition: color 0.25s ease, border-color 0.25s ease;
    }

    .sim-list a:hover,
    .sim-list a:focus-visible {
      color: var(--fg);
      border-color: var(--border-hover);
    }

    /* NAV */
    .links a {
      margin: 0.5rem 0.75rem;
      color: var(--sub);
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.12rem;
      text-transform: uppercase;
      transition: color 0.25s ease;
    }

    .links a:hover { color: var(--fg); }

    /* ANIMATIONS */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .studio-title {
        font-size: 2.2rem;
        letter-spacing: 0.28rem;
      }

      .sim-list a {
        font-size: 1.25rem;
        letter-spacing: 0.22rem;
        padding: 1.35rem 0.5rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<body>

  <div class="contact">
    <a href="mailto:inebriantstudios@gmail.com">inebriantstudios@gmail.com</a>
  </div>

  <h1 class="studio-title">INEBRIANT STUDIOS</h1>
  <div class="page-title">SIMULATIONS</div>

  <nav class="sim-list">
    <a href="/room.html">Room</a>
    <a href="/halloween.html">Halloween</a>
  </nav>

  <div class="links">
    <a href="/">Back to Home</a>
  </div>

</body>
</html>
